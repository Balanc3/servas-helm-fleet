{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "servas-helm.fullname" . }}
  labels:
    {{- include "servas-helm.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.Servas.appURL | replace "http://" ""  }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "servas-helm.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
